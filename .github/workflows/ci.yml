name: CI

# CI-blocking gates (DEFINITION_OF_DONE): pytest + engine coverage >=90%, frontend
# tests, the test:code ratio gate (>1.3 on the PR diff AND repo-wide), lint/types,
# and the three-way golden recalc gate (pinned LibreOffice). Nothing merges red.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + engine coverage >=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110" "uvicorn[standard]" "pydantic>=2" httpx openpyxl bleach \
                      pytest pytest-cov ruff mypy hypothesis
      - name: Lint (ruff)
        run: ruff check app engine scripts
      - name: Types (mypy)
        run: mypy app engine
      - name: Migration safety gate (additive-only scanner)
        # Fail-closed: rejects DROP TABLE/COLUMN/INDEX, RENAME, destructive ALTER,
        # TRUNCATE, bulk DELETE, or table-recreate in any shipped migration BEFORE
        # it can run against the single durable volume (OPS_RUNBOOK §8 / #90).
        run: python -m scripts.migration_lint
      - name: pytest + engine branch coverage gate (fail_under=90)
        run: pytest -q --cov --cov-report=term-missing

  frontend:
    name: Frontend (vitest + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit/component tests
        run: npx vitest run
      - name: Build (hashed JS only — CSP has no unsafe-inline)
        run: npx vite build

  ratio-gate:
    name: test:code ratio (>1.3 diff AND repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for the diff ratio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloc (the meter is cloc-based)
        run: sudo apt-get update && sudo apt-get install -y cloc
      - name: Ratio meter self-test (the gate cannot rot)
        run: python -m pip install pytest && python -m pytest scripts/test_ratio.py -q
      - name: Repo-wide ratio gate (>1.3)
        run: python scripts/ratio.py
      - name: PR diff ratio gate (>1.3)
        if: github.event_name == 'pull_request'
        run: python scripts/ratio.py --diff origin/${{ github.base_ref }}

  golden-recalc-gate:
    name: Three-way golden recalc (pinned LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (pinned) + coreutils timeout
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc-nogui coreutils
          soffice --version
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2" openpyxl pytest pytest-cov hypothesis
      - name: Golden gate (server == computed_json == LibreOffice recalc)
        # Fail-closed: a recalc {"error":...} or total_errors>0 fails the build.
        # With AND without overrides. The xlsx leg activates once M1.6 lands; until
        # then legs (a)==(b) reconcile and (c) records an explicit skip reason.
        run: pytest -q engine/tests/

  docker-boot:
    name: Docker image boots (build + /api/health)
    # The prod deploy crash-looped once because the Dockerfile's hardcoded pip list
    # was missing `bleach` (`import bleach` failed at boot) and CI never built the
    # image, so it was invisible until prod. scripts/test_dockerfile_deps.py guards
    # dep-list DRIFT but cannot catch OTHER boot failures (bad start.sh, a config-gate
    # refusal, a non-pip import). This job builds the REAL multi-stage prod image and
    # BOOTS it, failing CI unless GET /api/health serves a 200 — catching the whole
    # boot-failure class BEFORE merge/deploy. See scripts/docker_smoke.sh for the env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx (layer cache)
        uses: docker/setup-buildx-action@v3
      - name: Build prod image (cached) and load into the daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: projections-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image + assert /api/health (200 + shape)
        # SKIP_BUILD=1: the image was already built (with cache) in the step above;
        # the script only runs the container, polls /api/health, and asserts the shape.
        run: SKIP_BUILD=1 bash scripts/docker_smoke.sh

  e2e:
    name: Playwright E2E (1440 / 768 / 375)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Playwright webServer boots the FastAPI app via `source ../.venv/bin/activate`
      # and the Vite dev server from ../web, so both must be provisioned here.
      - name: Backend venv at repo root (Playwright webServer activates ../.venv)
        working-directory: .
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110" "uvicorn[standard]" "pydantic>=2" httpx openpyxl bleach
      - name: Install web deps (Vite webServer runs from ../web)
        working-directory: web
        run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: E2E flows (happy / override+409 / read-only / feedback / AI-disabled / degraded-a11y)
        # The webServer (playwright.config.ts) boots uvicorn with E2E_SEED=1 (seeds
        # the `example` projection + `board-slug` role link AND bypasses the rate
        # limiter) + Vite, across the 1440/768/375 viewport matrix. The happy path
        # drives the real wizard -> server compute -> decision banner + milestones ->
        # a 200 .xlsx download (#141). Screenshots archived on failure.
        run: npx playwright test
      - name: Assert the E2E gate actually ran (fail-on-empty, #198)
        # Playwright has no built-in fail-on-empty: a suite that skips 100% of its
        # tests still exits 0. This guard fails the build unless real tests executed,
        # so the "Playwright E2E" check can never again be green on a hollow run.
        run: node assert_e2e_ran.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

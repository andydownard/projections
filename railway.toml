# railway.toml — Railway service config (M0.7 / OPS_RUNBOOK).
# Single replica, durable volume at /data, healthcheck on /api/health.
# watchPatterns=["**"] so no change deploys as silently SKIPPED.

[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
numReplicas = 1
restartPolicyType = "always"
sleepApplication = false

[deploy.watchPatterns]
patterns = ["**"]

# Volume is mounted at /data (NOT /app — the DB must live on the durable volume).
# DB_PATH=/data/projections.db is set as a service env var, not here.

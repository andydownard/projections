# railway.toml — Railway service config (M0.7 / OPS_RUNBOOK).
# Single replica, durable volume at /data, healthcheck on /api/health.
# watchPatterns=["**"] so no change deploys as silently SKIPPED.

[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"
# watchPatterns belongs under [build] as a direct string array (Railway schema).
# The old [deploy.watchPatterns] sub-table was invalid and ignored, so GitHub
# pushes fell back to the dashboard setting and deployed as silently SKIPPED.
watchPatterns = ["**"]

[deploy]
# The Dockerfile CMD binds :8000, but Railway routes the healthcheck to the
# service target port (8080 historically). Without this startCommand the deploy
# ran on :8000 and the healthcheck failed "service unavailable" (outage).
# Bind Railway's injected $PORT when present, else the documented 8080.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
numReplicas = 1
restartPolicyType = "always"
restartPolicyMaxRetries = 10
sleepApplication = false

# Volume is mounted at /data (NOT /app — the DB must live on the durable volume).
# DB_PATH=/data/projections.db is set as a service env var, not here.

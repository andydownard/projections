<!--
  penny-avatar.svg — crisp vector companion to penny-avatar.png (spec §14).
  Penny (the projection assistant): a coin-inspired badge. Brand-green disc
  (#35644f), cream coin face, deep-green "P" monogram. Static by design — no
  animation — so it honors prefers-reduced-motion by construction. Referenced as
  a static asset from web/public; the PennyDrawer FAB + header use the PNG raster
  (256px → crisp at the 48px FAB / 32px header), this SVG is the scalable source.
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Penny">
  <circle cx="128" cy="128" r="128" fill="#35644F"/>
  <circle cx="128" cy="128" r="100" fill="#D2C6A0"/>
  <circle cx="128" cy="128" r="92" fill="#F3EFE4"/>
  <text x="128" y="129" fill="#1D4733" font-family="Arial, Helvetica, sans-serif"
        font-size="150" font-weight="700" text-anchor="middle" dominant-baseline="central">P</text>
</svg>
